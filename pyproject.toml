[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bayesian-gp-cvloss"
version = "0.1.2"
description = "A Python package for Gaussian Process Regression with hyperparameter optimization using Hyperopt and cross-validation, focusing on optimizing cross-validated loss."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Shifa Zhong", email = "sfzhong@tongji.edu.cn" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gpflow>=2.0.0",
    "hyperopt>=0.2.0",
    "scikit-learn>=0.23.0",
    "pandas>=1.0.0",
    "numpy>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/Shifa-Zhong/bayesian-gp-cvloss"
Repository = "https://github.com/Shifa-Zhong/bayesian-gp-cvloss"
